<html lang="pt-BR">
<head>

<style>
@font-face { font-family: "DM Sans"; font-weight: 400; font-display: swap; src: url("assets/fontes/DMSans_400Regular.ttf") format("truetype"); }
@font-face { font-family: "DM Sans"; font-weight: 700; font-display: swap; src: url("assets/fontes/DMSans_700Bold.ttf") format("truetype"); }
:root { --azul: #0F2347; --noite: #0A1833; --laranja: #FF6B3D; --amarelo: #FFC845; --lilas: #C9A7FF; --off: #F8F6F2; --linha: rgba(255,255,255,.1); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; min-height: 100dvh; font-family: "DM Sans", system-ui, sans-serif; color: #fff; background: var(--noite);
  background-image: radial-gradient(ellipse 90% 55% at 50% 0%, rgba(40,78,150,.55) 0%, rgba(40,78,150,0) 70%), linear-gradient(180deg, #132a55 0%, var(--azul) 40%, var(--noite) 100%);
  background-attachment: fixed; -webkit-font-smoothing: antialiased; }
.faixa { position: fixed; left: 0; right: 0; top: 0; height: 6px; display: flex; z-index: 5; }
.faixa i { flex: 1; } .faixa i:nth-child(1) { background: #22407a; } .faixa i:nth-child(2) { background: var(--laranja); } .faixa i:nth-child(3) { background: var(--amarelo); } .faixa i:nth-child(4) { background: var(--lilas); }
main { width: 100%; max-width: 480px; margin: 0 auto; padding: 44px 20px 40px; }
header { text-align: center; }
.logo { width: 132px; height: auto; display: block; margin: 0 auto; }
h1 { font-size: 15px; font-weight: 400; color: rgba(255,255,255,.72); margin-top: 14px; letter-spacing: .01em; }
.lema { margin-top: 18px; font-size: 26px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.12; }
.lema em { font-style: normal; color: var(--laranja); }
.aviso { display: none; margin-top: 20px; padding: 12px 16px; border-radius: 14px; background: var(--amarelo); color: var(--azul); font-weight: 700; font-size: 15px; text-align: center; line-height: 1.35; }
.aviso.on { display: block; }
/* bloco da eleição: mesmo visual do panfleto (fundo claro, "de novo" em laranja, dias em azul) */
.eleicao { display: none; margin-top: 22px; padding: 16px 16px 14px; border-radius: 18px; background: var(--off); color: var(--azul); text-align: left; box-shadow: 0 12px 32px rgba(0,0,0,.28); }
.eleicao.on { display: block; }
.el-rot { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #C2410C; }
.el-tit { display: block; margin-top: 6px; font-size: 25px; line-height: 1.12; letter-spacing: -0.03em; }
.el-tit mark { background: var(--laranja); color: var(--azul); padding: 0 6px; border-radius: 4px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.el-nota { margin-top: 6px; font-size: 13.5px; color: #4A5468; line-height: 1.35; }
.dias { list-style: none; margin-top: 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dias li { display: flex; flex-direction: column; align-items: center; padding: 8px 4px 7px; border-radius: 12px; background: var(--azul); color: #fff; line-height: 1.05; }
.dias li span { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .75; }
.dias li b { font-size: 26px; letter-spacing: -0.02em; margin-top: 3px; }
.dias li small { font-size: 11.5px; opacity: .75; margin-top: 2px; }
.dias li.hoje { background: var(--laranja); color: var(--azul); }
.dias li.hoje span, .dias li.hoje small { opacity: 1; }
.dias li.foi { opacity: .32; }
.el-info { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14.5px; font-weight: 700; }
.el-info span { display: inline-flex; align-items: center; gap: 6px; }
.el-info svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.el-status { margin-top: 12px; padding-top: 11px; border-top: 1px solid rgba(15,35,71,.12); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
.el-status i { width: 9px; height: 9px; border-radius: 50%; background: var(--laranja); flex: none; }
.el-status.aberta i { box-shadow: 0 0 0 0 rgba(255,107,61,.6); animation: pulso 1.8s infinite; }
@keyframes pulso { 70% { box-shadow: 0 0 0 8px rgba(255,107,61,0); } 100% { box-shadow: 0 0 0 0 rgba(255,107,61,0); } }
.txt b .tag { display: inline-block; margin: 0 0 0 7px; vertical-align: 2px; padding: 2px 7px; border-radius: 999px; background: var(--laranja); color: var(--azul); font-size: 10.5px; line-height: 1.4; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
nav { margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }
.link { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; padding: 12px 16px 12px 12px; border-radius: 18px; border: 1.5px solid var(--linha);
  background: rgba(255,255,255,.06); color: #fff; text-decoration: none; font: inherit; text-align: left; cursor: pointer;
  transition: transform .15s ease, background .15s ease, border-color .15s ease; -webkit-tap-highlight-color: transparent; }
.link:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); }
.link:active { transform: scale(.985); }
.link:focus-visible, .proposta:focus-visible, .btn:focus-visible, .fechar:focus-visible, .seta:focus-visible { outline: 3px solid var(--amarelo); outline-offset: 2px; }
.ic { width: 48px; height: 48px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; }
.ic svg { width: 26px; height: 26px; fill: none; stroke: var(--azul); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.txt { flex: 1; min-width: 0; }
.txt b { display: block; font-size: 17px; letter-spacing: -0.01em; }
.txt span { display: block; font-size: 13.5px; color: rgba(255,255,255,.68); margin-top: 2px; line-height: 1.3; }
.fim { flex: none; width: 22px; height: 22px; opacity: .55; }
.fim svg { width: 100%; height: 100%; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s ease; }
.selo { flex: none; font-size: 11.5px; font-weight: 700; letter-spacing: .02em; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.1); color: rgba(255,255,255,.8); }
.link.breve { cursor: default; opacity: .62; }
.link.breve:hover { background: rgba(255,255,255,.06); border-color: var(--linha); }
.link.breve:active { transform: none; }
.link[aria-expanded="true"] { border-color: rgba(255,200,69,.55); background: rgba(255,200,69,.08); }
.link[aria-expanded="true"] .fim svg { transform: rotate(180deg); }
.hub { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; overflow: hidden; max-height: 0; opacity: 0; transition: max-height .35s ease, opacity .25s ease, margin .35s ease; }
.hub.on { max-height: 520px; opacity: 1; margin: 2px 0 4px; }
.proposta { position: relative; aspect-ratio: 1 / 1; border-radius: 16px; border: 1.5px solid var(--linha); background: rgba(255,255,255,.05); color: #fff; font: inherit; cursor: pointer; overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end; text-align: left; padding: 12px; transition: transform .15s ease, border-color .15s ease; }
.proposta:hover { border-color: rgba(255,255,255,.22); }
.proposta:active { transform: scale(.98); }
.proposta img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.proposta.com-img { padding: 0; }
.proposta .rotulo { position: relative; padding: 9px 12px 10px; background: var(--azul); border-top: 1px solid rgba(255,255,255,.12); }
.proposta .rotulo b { display: block; font-size: 14.5px; }
.proposta .ic { width: 40px; height: 40px; margin-bottom: auto; position: relative; }
.proposta .ic svg { width: 22px; height: 22px; }
.proposta b { position: relative; font-size: 15.5px; line-height: 1.15; letter-spacing: -0.01em; }
.proposta small { position: relative; font-size: 11.5px; color: rgba(255,255,255,.7); margin-top: 4px; }
.proposta.breve { cursor: default; }
.proposta.breve:active { transform: none; }
.acoes { margin-top: 26px; display: flex; justify-content: center; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 999px; border: 1.5px solid var(--linha); background: rgba(255,255,255,.06); color: #fff; font: inherit; font-size: 14.5px; font-weight: 700; cursor: pointer; }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn:hover { background: rgba(255,255,255,.1); }
footer { margin-top: 30px; text-align: center; font-size: 13px; color: rgba(255,255,255,.5); line-height: 1.6; }
footer a { color: rgba(255,255,255,.75); }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 11px 18px; border-radius: 999px; background: var(--off); color: var(--azul); font-weight: 700; font-size: 14px; transition: all .25s ease; z-index: 30; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
/* visualizador das propostas */
.vis { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; background: rgba(6,14,32,.96); }
.vis.on { display: flex; }
.vis-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: max(14px, env(safe-area-inset-top)) 16px 10px; }
.vis-topo b { font-size: 16px; }
.vis-topo span { display: block; font-size: 12.5px; color: rgba(255,255,255,.6); font-weight: 400; margin-top: 2px; }
.fechar, .seta { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--linha); background: rgba(255,255,255,.08); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none; }
.fechar svg, .seta svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.vis-img { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 12px; touch-action: pan-y; }
.vis-img img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.vis-pe { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 12px 16px max(16px, env(safe-area-inset-bottom)); }
.pontos { display: flex; gap: 7px; }
.pontos i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.3); }
.pontos i.on { background: var(--amarelo); width: 22px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (min-width: 560px) { main { padding-top: 64px; } .lema { font-size: 30px; } }
</style>
</head>
<body>
<div class="faixa" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<main>
  <header>
    <img class="logo" src="assets/logo.svg" alt="Prisma · Grêmio Politécnico" width="132" height="100">
    <h1>Chapa para o Grêmio Politécnico</h1>
    <p class="lema">Diferentes perspectivas.<br>Uma só <em>Poli.</em></p>
    <div class="aviso" id="aviso" role="status"></div>
    <section class="eleicao" id="eleicao" aria-label="Datas da eleição do Grêmio"></section>
  </header>
  <nav id="links" aria-label="Links da Chapa Prisma"></nav>
  <div class="acoes">
    <button class="btn" id="compartilhar" type="button"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Compartilhar</button>
  </div>
  <footer>Chapa Prisma · Grêmio Politécnico da Poli-USP<br><a href="https://www.instagram.com/prisma.poli/" rel="noopener">@prisma.poli</a></footer>
</main>

<div class="vis" id="vis" role="dialog" aria-modal="true" aria-labelledby="vis-titulo">
  <div class="vis-topo"><div><b id="vis-titulo"></b><span id="vis-sub"></span></div>
    <button class="fechar" id="vis-fechar" type="button" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="vis-img" id="vis-img"></div>
  <div class="vis-pe">
    <button class="seta" id="vis-ant" type="button" aria-label="Proposta anterior"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="pontos" id="vis-pontos"></div>
    <button class="seta" id="vis-prox" type="button" aria-label="Próxima proposta"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ===================== EDITE AQUI =====================
// Aviso no topo (faixa amarela de texto livre). Vazio = escondido.
const AVISO = "";
// Eleição: bloco com os dias de votação. Destaca o dia de hoje e some sozinho
// depois do horário de fechamento do último dia. ELEICAO = null esconde o bloco.
// No título, o trecho entre *asteriscos* fica marcado em laranja.
const ELEICAO = {
  rotulo: "Nova eleição do Grêmio",
  titulo: "Votou? Vote *de novo.*",
  nota: "A votação de 10 a 12/11 foi anulada. Quem já votou precisa votar outra vez.",
  dias: ["2026-11-24", "2026-11-25", "2026-11-26"], // AAAA-MM-DD
  abre: "08:00", fecha: "18:00",                     // horário de Brasília
  dica: "NUSP, e-Card ou carteirinha",
};
// Links principais. url vazia = aparece como "em breve".
// Com `arquivo`, o cartão fica "em breve" até esse arquivo existir no repositório e então liga sozinho.
const LINKS = [
  { id: "instagram", titulo: "Instagram", sub: "@prisma.poli · novidades e bastidores", url: "https://www.instagram.com/prisma.poli/", icone: "instagram", cor: "#FF6B3D" },
  { id: "site", titulo: "Site da chapa", sub: "Quem somos, propostas e como votar", url: "https://chapaprisma.github.io/site_chapa/", icone: "prisma", cor: "#FFC845" },
  { id: "fuja-p3", titulo: "Fuja das P3", tag: "novo", sub: "P3 antigas resolvidas, guia do que cai e simulado", url: "https://chapaprisma.github.io/fuja-das-p3/", icone: "prova", cor: "#FF6B3D" },
  { id: "gremio", titulo: "Site do Grêmio", sub: "Salas livres, montador de grade, bandejões e mais", url: "https://chapaprisma.github.io/Site_gremio_poli/", icone: "predio", cor: "#C9A7FF" },
  { id: "carta", titulo: "Carta-programa", sub: "Todas as nossas propostas, por extenso", url: "", arquivo: "carta-proposta.pdf", icone: "carta", cor: "#F8F6F2" },
  { id: "hub", titulo: "Hub de propostas", sub: "As propostas por tema, em imagens", hub: true, icone: "grade", cor: "#FFC845" },
];
// Hub de propostas: ponha a imagem na pasta propostas/ com o nome indicado (.png, .jpg, .jpeg ou .webp) e ela aparece sozinha.
const PROPOSTAS = [
  { id: "rds", titulo: "RDs", sub: "Representação discente", img: "propostas/rds", icone: "megafone", cor: "#C9A7FF" },
  { id: "tecnologia", titulo: "Tecnologia e Inovação", sub: "Digitalização e ferramentas", img: "propostas/tecnologia", icone: "chip", cor: "#FFC845" },
  { id: "negocios", titulo: "Negócios", sub: "Triedro, Copiadora, Poliglota", img: "propostas/negocios", icone: "loja", cor: "#FF6B3D" },
  { id: "social", titulo: "Social e AEXs", sub: "Projetos sociais e extensão", img: "propostas/social", icone: "coracao", cor: "#F8F6F2" },
];
// ======================================================

const ICONES = {
  instagram: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="#0F2347"/>',
  prisma: '<path d="M6 3v18M6 3l13 8-13 8"/>',
  predio: '<path d="M3 9l9-6 9 6"/><path d="M5 10v9M9.5 10v9M14.5 10v9M19 10v9M3 21h18"/>',
  carta: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
  prova: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2.5h6v3H9z"/><path d="M9 13l2.2 2.2L15.5 11"/>',
  grade: '<rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/>',
  megafone: '<path d="M3 10v4h3l8 5V5L6 10z"/><path d="M18 9c1.5 1.5 1.5 4.5 0 6"/>',
  chip: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  loja: '<path d="M3 9l2-5h14l2 5"/><path d="M4 9v11h16V9M3 9h18"/><path d="M10 20v-6h4v6"/>',
  coracao: '<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.7A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>',
};
const SETA = '<svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg>';
const DESCE = '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
const ic = (n, cor) => `<span class="ic" style="background:${cor}"><svg viewBox="0 0 24 24">${ICONES[n]}</svg></span>`;
const conta = (nome) => { try { window.goatcounter && window.goatcounter.count({ path: "clique-" + nome, title: nome, event: true }); } catch (e) {} };

if (AVISO) { const a = document.getElementById("aviso"); a.textContent = AVISO; a.classList.add("on"); }

const nav = document.getElementById("links");
LINKS.forEach((l) => {
  if (l.hub) {
    const b = document.createElement("button");
    b.className = "link"; b.type = "button"; b.id = "hub-botao";
    b.setAttribute("aria-expanded", "false"); b.setAttribute("aria-controls", "hub");
    b.innerHTML = `${ic(l.icone, l.cor)}<span class="txt"><b>${l.titulo}</b><span>${l.sub}</span></span><span class="fim">${DESCE}</span>`;
    nav.appendChild(b);
    const g = document.createElement("div"); g.className = "hub"; g.id = "hub"; nav.appendChild(g);
    b.addEventListener("click", () => abreHub(b.getAttribute("aria-expanded") !== "true"));
    return;
  }
  const el = cartao(l, l.url);
  nav.appendChild(el);
  // cartão com arquivo: liga sozinho quando o arquivo existir no repositório
  if (!l.url && l.arquivo) {
    fetch(l.arquivo, { method: "HEAD", cache: "no-store" }).then((r) => { if (r.ok) el.replaceWith(cartao(l, l.arquivo)); }).catch(() => {});
  }
});
function cartao(l, url) {
  const el = document.createElement(url ? "a" : "div");
  el.className = "link" + (url ? "" : " breve");
  if (url) { el.href = url; el.rel = "noopener"; el.addEventListener("click", () => conta(l.id)); }
  else el.setAttribute("aria-disabled", "true");
  const tag = l.tag ? `<span class="tag">${l.tag}</span>` : "";
  el.innerHTML = `${ic(l.icone, l.cor)}<span class="txt"><b>${l.titulo}${tag}</b><span>${l.sub}</span></span>` + (url ? `<span class="fim">${SETA}</span>` : `<span class="selo">em breve</span>`);
  return el;
}

// eleição: dias com "hoje" em destaque e status (começa / aberta / reabre); some depois do último dia
const SEMANA = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hora = (h) => { const [hh, mm] = h.split(":"); return +hh + "h" + (mm !== "00" ? mm : ""); };
const quando = (dia, h) => Date.parse(`${dia}T${h}:00-03:00`);
const diaSP = (ms) => new Date(ms - 3 * 3600e3).toISOString().slice(0, 10);
function eleicao() {
  const box = document.getElementById("eleicao"), E = ELEICAO;
  if (!E || !E.dias || !E.dias.length) { box.classList.remove("on"); return; }
  const agora = Date.now();
  if (agora > quando(E.dias[E.dias.length - 1], E.fecha)) { box.classList.remove("on"); return; }
  const hoje = diaSP(agora), amanha = diaSP(agora + 864e5);
  const prox = E.dias.findIndex((d) => agora < quando(d, E.fecha)); // dia atual ou o próximo
  const chips = E.dias.map((d, i) => {
    const dt = new Date(d + "T12:00:00Z");
    const eHoje = d === hoje && i >= prox; // dia de hoje que ainda não fechou
    const cls = i < prox ? "foi" : eHoje ? "hoje" : "";
    return `<li class="${cls}"><span>${SEMANA[dt.getUTCDay()]}</span><b>${dt.getUTCDate()}</b><small>${eHoje ? "hoje" : MESES[dt.getUTCMonth()]}</small></li>`;
  }).join("");
  const d = E.dias[prox], ultimo = prox === E.dias.length - 1;
  let status, aberta = false;
  if (agora >= quando(d, E.abre)) { aberta = true; status = ultimo ? `Último dia · aberta até as ${hora(E.fecha)}` : `Votação aberta agora, até as ${hora(E.fecha)}`; }
  else {
    const dt = new Date(d + "T12:00:00Z");
    const qual = d === hoje ? "hoje" : d === amanha ? "amanhã" : `${SEMANA[dt.getUTCDay()]}, ${dt.getUTCDate()}/${dt.getUTCMonth() + 1},`;
    status = (prox === 0 ? "Começa " : ultimo ? "Último dia: abre " : "Reabre ") + `${qual} às ${hora(E.abre)}`;
  }
  const titulo = esc(E.titulo).replace(/\*(.+?)\*/g, "<mark>$1</mark>");
  const relogio = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  const cartaoId = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.6-1.6 1.7-2.4 3-2.4s2.4.8 3 2.4M14 10h4M14 14h3"/></svg>';
  box.innerHTML = `<span class="el-rot">${esc(E.rotulo)}</span><b class="el-tit">${titulo}</b>` +
    (E.nota ? `<p class="el-nota">${esc(E.nota)}</p>` : "") +
    `<ol class="dias">${chips}</ol>` +
    `<p class="el-info"><span>${relogio}Das ${hora(E.abre)} às ${hora(E.fecha)}</span>` + (E.dica ? `<span>${cartaoId}${esc(E.dica)}</span>` : "") + `</p>` +
    `<p class="el-status${aberta ? " aberta" : ""}"><i></i>${status}</p>`;
  box.classList.add("on");
}
eleicao();
setInterval(eleicao, 60e3);

// hub: cada proposta vira "pronta" quando a imagem existe
const hub = document.getElementById("hub");
const prontas = [];
PROPOSTAS.forEach((p) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "proposta breve"; b.disabled = true;
  b.innerHTML = `${ic(p.icone, p.cor)}<b>${p.titulo}</b><small>em breve</small>`;
  hub.appendChild(b);
  // tenta cada extensão até achar a imagem
  const EXTS = [".png", ".jpg", ".jpeg", ".webp"];
  const tenta = (k) => {
    if (k >= EXTS.length) return;
    const img = new Image();
    img.onload = () => {
      p.src = p.img + EXTS[k];
      b.classList.remove("breve"); b.classList.add("com-img"); b.disabled = false;
      b.setAttribute("aria-label", `${p.titulo}: ${p.sub}`);
      b.innerHTML = `<img src="${p.src}" alt=""><span class="rotulo"><b>${p.titulo}</b></span>`;
      p.pronta = true; prontas.push(p); prontas.sort((x, y) => PROPOSTAS.indexOf(x) - PROPOSTAS.indexOf(y));
      b.addEventListener("click", () => abreVis(p.id));
      if (location.hash === "#" + p.id) { abreHub(true); abreVis(p.id); }
    };
    img.onerror = () => tenta(k + 1);
    img.src = p.img + EXTS[k];
  };
  tenta(0);
});
function abreHub(on) {
  const b = document.getElementById("hub-botao");
  b.setAttribute("aria-expanded", on ? "true" : "false"); hub.classList.toggle("on", on);
  if (on) conta("hub");
}
if (location.hash === "#hub") abreHub(true);

// visualizador
const vis = document.getElementById("vis");
let atual = 0, ultimoFoco = null;
function abreVis(id) {
  atual = Math.max(0, prontas.findIndex((p) => p.id === id));
  ultimoFoco = document.activeElement; mostra(); vis.classList.add("on"); document.body.style.overflow = "hidden";
  document.getElementById("vis-fechar").focus(); conta("proposta-" + id);
}
function fechaVis() { vis.classList.remove("on"); document.body.style.overflow = ""; history.replaceState(null, "", location.pathname + "#hub"); ultimoFoco && ultimoFoco.focus(); }
function mostra() {
  const p = prontas[atual];
  document.getElementById("vis-titulo").textContent = p.titulo;
  document.getElementById("vis-sub").textContent = `Propostas · ${atual + 1} de ${prontas.length}`;
  document.getElementById("vis-img").innerHTML = `<img src="${p.src}" alt="Propostas da Prisma: ${p.titulo}">`;
  document.getElementById("vis-pontos").innerHTML = prontas.map((_, i) => `<i class="${i === atual ? "on" : ""}"></i>`).join("");
  const um = prontas.length < 2; document.getElementById("vis-ant").style.visibility = um ? "hidden" : ""; document.getElementById("vis-prox").style.visibility = um ? "hidden" : "";
  history.replaceState(null, "", location.pathname + "#" + p.id);
}
const passa = (d) => { atual = (atual + d + prontas.length) % prontas.length; mostra(); };
document.getElementById("vis-fechar").onclick = fechaVis;
document.getElementById("vis-ant").onclick = () => passa(-1);
document.getElementById("vis-prox").onclick = () => passa(1);
vis.addEventListener("click", (e) => { if (e.target === vis || e.target.id === "vis-img") fechaVis(); });
document.addEventListener("keydown", (e) => { if (!vis.classList.contains("on")) return;
  if (e.key === "Escape") fechaVis(); if (e.key === "ArrowLeft") passa(-1); if (e.key === "ArrowRight") passa(1); });
let x0 = null;
vis.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
vis.addEventListener("touchend", (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) passa(dx < 0 ? 1 : -1); x0 = null; });

// compartilhar
const toast = (t) => { const e = document.getElementById("toast"); e.textContent = t; e.classList.add("on"); setTimeout(() => e.classList.remove("on"), 2200); };
document.getElementById("compartilhar").onclick = async () => {
  const dados = { title: "Chapa Prisma", text: "Todos os links da Chapa Prisma, Grêmio Politécnico", url: location.origin + location.pathname };
  conta("compartilhar");
  try { if (navigator.share) { await navigator.share(dados); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(dados.url); toast("Link copiado"); } catch (e) { toast(dados.url); }
};
</script>
